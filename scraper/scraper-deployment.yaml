apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scraper
  template:
    metadata:
      labels:
        app: scraper
    spec:
      containers:
        - name: scraper
          image: scraper:latest
          imagePullPolicy: Never
          env:
            - name: SCRAPER_DATA_DIR
              value: "/data"
          volumeMounts:
            - name: scraper-data
              mountPath: /data
      volumes:
        - name: scraper-data
          emptyDir: {}